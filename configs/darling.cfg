# Darling (macOS compatibility layer) kernel prerequisites.
#
# References:
#   - https://docs.darlinghq.org/internals/basics/containerization.html
#     Prefixes are overlayfs mounts inside new mount + PID namespaces.
#   - https://docs.darlinghq.org/common-issues.html
#     Low mmap addresses needed by old Mach-O binaries ("Cannot mmap segment
#     __TEXT at 0x1000: Operation not permitted").
#
# Since Darling 0.1 the Mach/XNU side lives in userspace (darlingserver + mldr),
# so no out-of-tree kernel module is required; only the host kernel features
# below. darlingserver uses memfd_create() and process_vm_readv() at runtime.

# Prefix containerization: mount + PID namespaces and overlayfs upper layer
enable CONFIG_NAMESPACES
enable CONFIG_UTS_NS
enable CONFIG_IPC_NS
enable CONFIG_PID_NS
enable CONFIG_NET_NS
enable CONFIG_USER_NS
enable CONFIG_OVERLAY_FS
enable CONFIG_TMPFS_XATTR

# Loader / process ABI used by mldr and darlingserver
enable CONFIG_BINFMT_MISC
enable CONFIG_IA32_EMULATION
enable CONFIG_COMPAT_32BIT_TIME
enable CONFIG_MEMFD_CREATE
enable CONFIG_CROSS_MEMORY_ATTACH
enable CONFIG_KCMP
enable CONFIG_USERFAULTFD
enable CONFIG_SECCOMP
enable CONFIG_SECCOMP_FILTER

# hdiutil / DMG and other image handling
enable CONFIG_FUSE_FS
enable CONFIG_BLK_DEV_LOOP

# Old macOS binaries map text segments at 0x1000 (or lower); the default
# 4096 limit makes them die with EPERM. 0 matches Darling's documented setup.
set-val CONFIG_DEFAULT_MMAP_MIN_ADDR 0
