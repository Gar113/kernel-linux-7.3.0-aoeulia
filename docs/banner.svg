<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PS4 Linux 7.3.0 - PSI + Darling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2b45" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="980" cy="40" rx="320" ry="180" fill="url(#glow)" filter="url(#soft)"/>

  <!-- console silhouette -->
  <g transform="translate(905 82)" opacity="0.95">
    <rect x="0" y="0" width="232" height="150" rx="14" fill="#0d1526" stroke="#2b3b5c"/>
    <path d="M0 74h232" stroke="#22304d"/>
    <rect x="18" y="18" width="196" height="38" rx="8" fill="#131e35" stroke="#2d3f63"/>
    <circle cx="36" cy="37" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="42" font-family="monospace" font-size="13" fill="#7d8fb3">power</text>
    <rect x="18" y="92" width="196" height="34" rx="6" fill="#0a1221" stroke="#263553"/>
    <text x="30" y="114" font-family="monospace" font-size="12" fill="#58a6ff">7.3.0-Gar113-NoLTO</text>
    <circle cx="196" cy="109" r="4" fill="#58a6ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <g font-family="'Helvetica Neue',Arial,sans-serif">
    <text x="64" y="86" font-size="15" letter-spacing="6" fill="#8b9bb8">PLAYSTATION 4 · AEOLIA · AMD JAGUAR</text>
    <text x="62" y="158" font-size="66" font-weight="700" fill="#e6edf3">PS4 Linux <tspan fill="url(#accent)">7.3.0</tspan></text>
    <text x="64" y="200" font-size="21" fill="#9fb0cc">Strawberry · clang 19.1.7 · PREEMPT_DYNAMIC · HZ 250</text>
  </g>

  <!-- feature chips -->
  <g font-family="monospace" font-size="14">
    <g>
      <rect x="64" y="228" width="132" height="34" rx="17" fill="#0f2417" stroke="#2ea043"/>
      <circle cx="86" cy="245" r="4" fill="#3fb950">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="250" fill="#3fb950">PSI · lmkd</text>
    </g>
    <g>
      <rect x="208" y="228" width="168" height="34" rx="17" fill="#1a1430" stroke="#8957e5"/>
      <circle cx="230" cy="245" r="4" fill="#a371f7">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="244" y="250" fill="#a371f7">Darling ready</text>
    </g>
    <g>
      <rect x="388" y="228" width="150" height="34" rx="17" fill="#0d1f33" stroke="#1f6feb"/>
      <circle cx="410" cy="245" r="4" fill="#58a6ff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="424" y="250" fill="#58a6ff">mmap_min=0</text>
    </g>
    <g>
      <rect x="550" y="228" width="168" height="34" rx="17" fill="#241a0d" stroke="#d29922"/>
      <circle cx="572" cy="245" r="4" fill="#e3b341"/>
      <text x="586" y="250" fill="#e3b341">MGLRU · zram</text>
    </g>
  </g>

  <!-- animated scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.55">
    <animate attributeName="y" values="0;318;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
