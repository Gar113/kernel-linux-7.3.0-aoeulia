<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470"
     viewBox="0 0 1120 470" role="img" aria-label="PSI: dari tekanan memori sampai lmkd">
<title>PSI: dari tekanan memori sampai lmkd</title>
<style>
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .sans { font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
  .t   { fill:#c9d1d9; }
  .d   { fill:#8b949e; }
  .flow { stroke-dasharray:5 7; animation:dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-24; } }
  @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
  @keyframes glow { 0%,100% { filter:drop-shadow(0 0 2px #3fb95088) }
                     50% { filter:drop-shadow(0 0 9px #3fb950cc) } }
  .pulse { animation:pulse 2.6s ease-in-out infinite; }
  .glow  { animation:glow 2.8s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="gcy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#a371f7" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="ggr" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
  </marker>
</defs>
<rect width="1120" height="470" fill="#0d1117"/>
<text x="32" y="46" class="sans t" font-size="26" font-weight="700">PSI — Pressure Stall Information</text><text x="32" y="72" class="mono d" font-size="13">lmkd membunuh proses berdasarkan tekanan, bukan ambang MemFree yang buta</text><rect x="32" y="150" width="176" height="92" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/><text x="120.0" y="178" text-anchor="middle" class="sans t" font-size="14" font-weight="700">Proses</text><text x="120.0" y="200" text-anchor="middle" class="mono d" font-size="11.5">Android / app</text><text x="120.0" y="219" text-anchor="middle" class="mono d" font-size="11.5">di Waydroid</text><rect x="242" y="150" width="176" height="92" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.4"/><text x="330.0" y="178" text-anchor="middle" class="sans t" font-size="14" font-weight="700">Kernel</text><text x="330.0" y="200" text-anchor="middle" class="mono d" font-size="11.5">hitung stall</text><text x="330.0" y="219" text-anchor="middle" class="mono d" font-size="11.5">some · full</text><rect x="452" y="150" width="176" height="92" rx="12" fill="#161b22" stroke="#e3b341" stroke-width="1.4"/><text x="540.0" y="178" text-anchor="middle" class="sans t" font-size="14" font-weight="700">/proc/pressure</text><text x="540.0" y="200" text-anchor="middle" class="mono d" font-size="11.5">memory</text><text x="540.0" y="219" text-anchor="middle" class="mono d" font-size="11.5">cpu · io</text><rect x="662" y="150" width="176" height="92" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="750.0" y="178" text-anchor="middle" class="sans t" font-size="14" font-weight="700">lmkd</text><text x="750.0" y="200" text-anchor="middle" class="mono d" font-size="11.5">baca avg10</text><text x="750.0" y="219" text-anchor="middle" class="mono d" font-size="11.5">tiap 1–2 s</text><rect x="872" y="150" width="176" height="92" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="960.0" y="178" text-anchor="middle" class="sans t" font-size="14" font-weight="700">kill</text><text x="960.0" y="200" text-anchor="middle" class="mono d" font-size="11.5">proses paling</text><text x="960.0" y="219" text-anchor="middle" class="mono d" font-size="11.5">banyak makan</text><path d="M210 196.0 H236" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle r="3.5" fill="#3fb950"><animateMotion dur="1.30s" repeatCount="indefinite" path="M210 196.0 H236"/></circle><path d="M420 196.0 H446" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle r="3.5" fill="#3fb950"><animateMotion dur="1.45s" repeatCount="indefinite" path="M420 196.0 H446"/></circle><path d="M630 196.0 H656" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle r="3.5" fill="#3fb950"><animateMotion dur="1.60s" repeatCount="indefinite" path="M630 196.0 H656"/></circle><path d="M840 196.0 H866" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle r="3.5" fill="#3fb950"><animateMotion dur="1.75s" repeatCount="indefinite" path="M840 196.0 H866"/></circle><rect x="252" y="300" width="150" height="10" rx="5" fill="#1c2430" stroke="#30363d"/><rect x="252" y="300" width="66" height="10" rx="5" fill="url(#ggr)"><animate attributeName="width" values="4;66;30;66;4" dur="6s" repeatCount="indefinite"/></rect><text x="252" y="330" class="mono d" font-size="11">avg10 = 30,44 saat tekanan</text><text x="32" y="356" class="mono d" font-size="12">memori terpakai saat tes: 4,00 GiB dialokasikan · swap out 582.753 halaman</text><rect x="32" y="366" width="1056" height="16" rx="8" fill="#1c2430" stroke="#30363d"/><rect x="32" y="366" width="620" height="16" rx="8" fill="#e3b341" opacity=".85"><animate attributeName="width" values="60;820;520;820;60" dur="6s" repeatCount="indefinite"/></rect><rect x="32" y="402" width="1056" height="52" rx="10" fill="#161b22" stroke="#30363d"/><text x="48" y="424" class="mono" font-size="12" fill="#3fb950">some</text><text x="96" y="424" class="mono d" font-size="12">= ada task yang stall</text><text x="300" y="424" class="mono" font-size="12" fill="#f85149">full</text><text x="340" y="424" class="mono d" font-size="12">= semua task stall (sistem benar-benar macet)</text><text x="48" y="444" class="mono d" font-size="11.5">CONFIG_PSI=y · PSI_DEFAULT_DISABLED=n · aktif sejak boot tanpa parameter cmdline</text><text x="1096" y="456" text-anchor="end" class="mono d" font-size="11">GAR 113 · PS4 Linux 7.3.0-Gar113-NoLTO</text>
</svg>

