<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Animasi build kernel: dari config sampai bzImage siap">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="60%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <style>
      .ln { font-family: monospace; font-size: 15px; }
      .dim { fill: #6e7f9e; }
      .ok  { fill: #3fb950; }
      .inf { fill: #58a6ff; }
      .wrn { fill: #e3b341; }
      .txt { fill: #c9d5e6; }
    </style>
  </defs>

  <rect width="1200" height="330" rx="12" fill="url(#term)" stroke="#233250"/>
  <rect width="1200" height="34" rx="12" fill="#111a2c"/>
  <rect y="22" width="1200" height="12" fill="#111a2c"/>
  <circle cx="26" cy="17" r="5" fill="#f85149"/>
  <circle cx="46" cy="17" r="5" fill="#e3b341"/>
  <circle cx="66" cy="17" r="5" fill="#3fb950"/>
  <text x="600" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#6e7f9e">ps4-kernel-build-darling.service — nice 10, -j6</text>

  <g class="ln">
    <text x="26" y="68" class="ok">$ DARLING=1 KNAME=Gar113-NoLTO ./build.sh
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.09;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="94" class="inf">[*] applying NoLTO + base + General profile
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.16;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="120" class="inf">[*] applying Darling (macOS layer) prerequisites
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.24;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="146" class="dim">[*] PSI=y  LOCALVERSION="-Gar113-NoLTO"  LTO=  (none)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="172" class="wrn">  CC      drivers/gpu/drm/amd/amdgpu/smuio_v11_0.o
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.42;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="198" class="txt">  CC      fs/overlayfs/super.o
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="224" class="txt">  LD      vmlinux.o
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.7;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="250" class="txt">  ZSTD22  arch/x86/boot/compressed/vmlinux.bin.zst
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.82;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="276" class="ok">Kernel: arch/x86/boot/bzImage is ready  (#2)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="302" class="inf">[*] done: ~/ps4-build-out-darling/bzImage   (19 MB, ±2 jam)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.94;0.97;1" dur="13s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- progress bar -->
  <g transform="translate(760 62)">
    <rect x="0" y="0" width="400" height="12" rx="6" fill="#16223a"/>
    <rect x="0" y="0" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.94;0.98;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <text x="200" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b9bb8">build progress</text>
    <g font-family="monospace" font-size="12" fill="#6e7f9e">
      <text x="0" y="72">config → olddefconfig → compile → link →</text>
      <text x="0" y="92">BTF → objcopy → zstd → bzImage</text>
    </g>
    <circle cx="6" cy="120" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="124" font-family="monospace" font-size="12" fill="#3fb950">exit 0</text>
  </g>

  <!-- blinking cursor -->
  <rect x="26" y="312" width="9" height="15" fill="#3fb950" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
